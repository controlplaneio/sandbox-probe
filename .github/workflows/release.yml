---
name: Release
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semantic_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        uses: lukaszraczylo/semver-generator@9d5b4b0b503562fecc7c60ace69ddfe10f9957a2 # v1
        with:
          config_file: semver.yaml
          repository_local: true
          strict: true

  release:
    name: Release on GitHub
    needs: version
    # darwin/arm64 builds natively and darwin/amd64 cross-compiles via
    # Xcode's clang here; linux targets cross-compile fine too since nothing
    # in the linux build path uses cgo. A Linux runner cannot produce a
    # working darwin build at all (no Apple SDK/frameworks), which is why
    # both prior release attempts failed at darwin_amd64_v1.
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Create local release tag
        run: |
          git tag "v${{ needs.version.outputs.semver }}"
          # GoReleaser creates the remote release and tag only after artifacts
          # build successfully. Do not push a tag before that transaction.

      - name: Launch goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew formula to the shared controlplaneio/homebrew-tap.
          # GITHUB_TOKEN can't write to a different repo, hence the separate PAT.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
