---
version: 2
before:
  hooks:
    - go mod tidy

builds:
  - main: "."
    binary: sandbox-probe
    # darwin needs cgo (seatbelt_darwin.go wraps Apple's private sandbox_check
    # API); linux has no cgo files and no cross C toolchain on the macOS
    # runner, so it must stay disabled there.
    env:
      - CGO_ENABLED={{ if eq .Os "darwin" }}1{{ else }}0{{ end }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X github.com/controlplaneio/sandbox-probe/cmd.version={{.Version}}
      - -X github.com/controlplaneio/sandbox-probe/cmd.commit={{.FullCommit}}
      - -X github.com/controlplaneio/sandbox-probe/cmd.date={{.CommitDate}}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

snapshot:
  name_template: "{{ .Tag }}-next"

# Publishes a Homebrew formula on every tagged release, covering macOS and
# Linux (WSL runs Linux binaries, so no separate WSL formula is needed).
# Pushes straight to the shared org tap (no protection there, unlike main
# here), so this is one release step, not a PR someone has to merge.
brews:
  - name: sandbox-probe
    repository:
      owner: controlplaneio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_msg_template: "Homebrew formula for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://github.com/controlplaneio/sandbox-probe"
    description: "Measure what an AI coding agent's sandbox actually allows, instead of trusting its policy on faith."
    license: "Apache-2.0"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@controlplane.io
    test: |
      system "#{bin}/sandbox-probe", "version"
